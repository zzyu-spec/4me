/* Personalized display settings */
:root{--photo-edge:88px}
body.photo-small{--photo-edge:62px}body.photo-medium{--photo-edge:88px}body.photo-large{--photo-edge:146px}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{width:var(--photo-edge);height:var(--photo-edge);object-fit:cover}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{cursor:zoom-in;transition:transform .15s ease,box-shadow .15s ease}
.photo-strip .photo-preview:hover,.photo-strip .photo-thumb img:hover{transform:scale(1.035);box-shadow:0 4px 14px #0000001a}
body.photos-off .photo-strip,body.photos-off .photo-pick,body.photos-off .photo-help{display:none!important}
.photo-hidden-note{display:none;border:1px dashed var(--line);background:var(--accent-soft);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted)}
body.photos-off .photo-hidden-note{display:block}
.mood button{--mood-color:var(--accent)}
.mood button.chosen{background:color-mix(in srgb,var(--mood-color) 15%,white);border-color:color-mix(in srgb,var(--mood-color) 46%,white);color:color-mix(in srgb,var(--mood-color) 75%,#252525)}
.mood button:not(.chosen):hover{border-color:var(--mood-color)}
.chip.mood-badge{background:color-mix(in srgb,var(--mood-color) 14%,white);border-color:color-mix(in srgb,var(--mood-color) 45%,white);color:color-mix(in srgb,var(--mood-color) 70%,#292929)}
.mood-reason-card{border-left:3px solid var(--mood-color,var(--accent))}
.setting-section{padding:3px 0 6px}.setting-section h3{margin:0 0 6px;font-size:15px}.setting-section .sub{margin-bottom:10px}
.setting-divider{border:0;border-top:1px solid var(--line);margin:6px 0}
.mood-color-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mood-color-item{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.mood-color-item span{flex:1;min-width:0;font-size:12px}.mood-color-item input[type=color]{width:38px;min-width:38px;height:32px;padding:2px;cursor:pointer}
.mood-color-item button{background:var(--accent-soft);color:var(--accent);border-radius:8px;font-size:11px;padding:7px}
.settings-group{display:flex;gap:7px;flex-wrap:wrap}
.settings-group .chip{cursor:pointer}.settings-group .chip.active{border-color:var(--accent)}
.settings-footer{font-size:11px;color:var(--muted)}
.photo-lightbox{position:fixed;inset:0;z-index:120;background:#14151be8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:58px 18px 26px}

function todoItem(t){const dim=t.status==='cancelled'||t.status==='moved';return `<div class="item" style="${dim?'opacity:.55':''}"><div class="status-wrap"><button class="status-trigger" data-action="statusMenu" data-id="${t.id}" aria-label="상태 선택" title="상태 선택">${statusSymbol(t.status)||'○'}</button></div><div class="body"><strong style="${t.status==='cancelled'?'text-decoration:line-through':''}">${esc(t.title)}</strong><div class="meta">${esc(t.section||'미분류')} · ${({daily:'데일리',weekly:'위클리',monthly:'먼슬리'})[t.period]||'데일리'}${t.date?' · '+esc(t.date):''}${t.time?' · '+esc(t.time):''}${t.due?' · 마감 '+esc(t.due):''}${t.movedFrom?' · 이월됨':''}</div><div class="actions" style="margin-top:9px"><button class="iconbtn" data-action="editTodo" data-id="${t.id}">수정</button><button class="iconbtn" data-action="deleteTodo" data-id="${t.id}">삭제</button></div></div></div>`}

function categoryIconKey(category){if(Object.hasOwn(EVENT_PICTOGRAMS,category.icon))return category.icon;const name=category.name||'';return /공부|수업|강의|독서|시험|과제/.test(name)?'book':/업무|회사|출근|알바|회의|일터/.test(name)?'work':/약속|친구|모임|만남/.test(name)?'people':/운동|헬스|요가|산책/.test(name)?'exercise':/휴식|카페|커피/.test(name)?'coffee':/식사|아침|점심|저녁/.test(name)?'meal':/건강|병원|진료/.test(name)?'heart':/여행|이동|외출/.test(name)?'travel':/개인|취미/.test(name)?'star':'clock'}

function categoryIconOptions(category){return Object.entries(EVENT_PICTOGRAMS).map(([key,icon])=>`<option value="${key}" ${categoryIconKey(category)===key?'selected':''}>${icon.label}</option>`).join('')}
function eventEndDate(e){return /^\d{4}-\d{2}-\d{2}$/.test(e.endDate||'')&&e.endDate>=e.date?e.endDate:e.date}
function eventOnDate(e,date){return e.date<=date&&date<=eventEndDate(e)}
function eventWindow(e,date){if(eventEndDate(e)===e.date||(!e.start&&!e.end))return {start:e.start||'',end:e.end||''};return {start:date===e.date?(e.start||'00:00'):'00:00',end:date===eventEndDate(e)?(e.end||'24:00'):'24:00'}}
function eventDateLabel(date){return String(date||'').replace(/-/g,'/')}
function eventPeriodLabel(e){const last=eventEndDate(e);if(last!==e.date)return eventDateLabel(e.date)+(e.start?' '+e.start:'')+' ~ '+eventDateLabel(last)+(e.end?' '+e.end:'');return eventDateLabel(e.date)+(e.start?' · '+e.start:'')+(e.end?(e.start?'–':' · 종료 ')+e.end:'')+(!e.start&&!e.end?' · 시간 미지정':'')}
function eventItem(e){let c=categoryOf(e);return `<div class="item event-card" style="border-left:3px solid ${esc(c.color)}"><div class="event-symbol" style="--event-color:${esc(c.color)}">${eventPictogram(c)}</div><div class="body"><div class="event-title-row"><strong>${esc(e.title)}</strong><div class="event-controls"><button type="button" class="iconbtn" data-action="editEvent" data-id="${esc(e.id)}" aria-label="일정 수정" title="일정 수정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg></button><button type="button" class="iconbtn" data-action="deleteEvent" data-id="${esc(e.id)}" aria-label="일정 삭제" title="일정 삭제"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button></div></div><div class="meta"><span class="event-category-label" style="color:${esc(c.color)}"><span class="category-line" aria-hidden="true"></span>${esc(categoryLabel(c))}</span><span class="event-period">${esc(eventPeriodLabel(e))}</span>${e.location?'<div class="event-location">장소 · '+esc(e.location)+'</div>':''}${e.note?'<div class="event-note">'+esc(e.note)+'</div>':''}</div></div></div>`}

function holidayName(iso){return (KR_HOLIDAYS[iso]||[]).join(' · ')}
function holidayLabelsHTML(iso){return (KR_HOLIDAYS[iso]||[]).map(name=>{const parts=name==='부처님오신날'?['부처님','오신날']:name==='대체공휴일'?['대체','공휴일']:[name];return `<span class="holiday-name" title="${esc(parts.join(' '))}" aria-label="${esc(parts.join(' '))}">${parts.map(part=>`<span class="holiday-label"><span class="holiday-text">${esc(part)}</span></span>`).join('')}</span>`}).join('')}
function fitHolidayLabel(label){const text=label.firstElementChild;if(!text)return;const available=label.clientWidth,natural=text.offsetWidth;if(available&&natural)text.style.transform=`scaleX(${Math.min(1,available/natural)})`}
const holidayLabelObserver=typeof ResizeObserver==='function'?new ResizeObserver(entries=>entries.forEach(({target})=>fitHolidayLabel(target))):null;
function refreshHolidayLabels(){holidayLabelObserver?.disconnect();$$('.holiday-label').forEach(label=>{fitHolidayLabel(label);holidayLabelObserver?.observe(label)})}
window.addEventListener('resize',refreshHolidayLabels);

function dateClass(iso){const day=new Date(iso+'T12:00:00').getDay();return [day===0?'sunday':day===6?'saturday':'',holidayName(iso)?'holiday':''].join(' ')}
function monthNavigator(month,scope){let [y,m]=month.split('-').map(Number);return `<div class="month-navigator"><button type="button" class="iconbtn" data-action="${scope==='mini'?'miniPrevMonth':'prevMonth'}" aria-label="이전 달">‹</button><select aria-label="년도 선택" data-nav-year="${scope}">${Array.from({length:151},(_,i)=>1900+i).map(n=>`<option value="${n}" ${n===y?'selected':''}>${n}년</option>`).join('')}</select><select aria-label="월 선택" data-nav-month="${scope}">${Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===m?'selected':''}>${n}월</option>`).join('')}</select><button type="button" class="iconbtn" data-action="${scope==='mini'?'miniNextMonth':'nextMonth'}" aria-label="다음 달">›</button></div>`}
function moveMonth(delta,mini){let current=mini?(state.miniMonth||state.selectedDate.slice(0,7)):state.month;let [y,m]=current.split('-').map(Number),dt=new Date(y,m-1+delta,1,12),next=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');if(mini)state.miniMonth=next;else state.month=next;save();render()}

function calendarWeekdays(){return state.weekStart==='mon'?['월','화','수','목','금','토','일']:weekdays}function weekOffset(date){return (new Date(date).getDay()-(state.weekStart==='mon'?1:0)+7)%7}function miniCalendar(d){let displayMonth=state.miniMonth||d.slice(0,7);let [y,m]=displayMonth.split('-').map(Number),first=weekOffset(new Date(y,m-1,1)),days=new Date(y,m,0).getDate();let s=monthNavigator(displayMonth,'mini')+'<div class="calendar">'+calendarWeekdays().map(x=>`<div class="weekday ${x==='토'?'saturday':x==='일'?'sunday':''}">${x}</div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let n=1;n<=days;n++){let iso=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,has=state.events.some(e=>eventOnDate(e,iso))||state.todos.some(t=>t.date===iso)||state.journals[iso];s+=`<button class="day ${dateClass(iso)} ${iso===d?'selected':''} ${iso===todayISO()?'today':''}" data-date="${iso}"><span class="num">${n}</span>${holidayLabelsHTML(iso)}${has?'<br><span class="dot"></span>':''}</button>`}return s+'</div>'}
function defaultEventCategory(){return (state.eventCategories||[]).find(c=>c.name==='카테고리 미정'||c.name==='기본')||{name:'카테고리 미정',color:'#6576b8'}}
function categoryLabel(category){return category.name==='기본'?'카테고리 미정':category.name}
function categoryOf(e){return (state.eventCategories||[]).find(c=>c.name===(e.category||defaultEventCategory().name))||defaultEventCategory()}

function sortedEvents(date){return dayEvents(date).slice().sort((a,b)=>{let at=eventWindow(a,date).start||'99:99',bt=eventWindow(b,date).start||'99:99';return at.localeCompare(bt)||String(a.title).localeCompare(String(b.title),'ko')})}
function calendarTodoPreview(t){return `<div class="calendar-todo-preview"><span class="todo-preview-status">${statusSymbol(t.status)||'○'}</span><div class="todo-preview-title">${esc(t.title)}<div class="todo-preview-meta">${esc(t.time||'시간 미정')}${t.section?' · '+esc(t.section):''}${t.status&&t.status!=='open'?' · '+esc(statusLabel(t.status)):''}</div></div></div>`}
function calendarHTML(){let [y,m]=state.month.split('-').map(Number),d=state.selectedDate,first=weekOffset(new Date(y,m-1,1)),days=new Date(y,m,0).getDate();let s='<div class="panel"><div class="calendar-head">'+monthNavigator(state.month,'calendar')+'<button class="btn secondary calendar-today" data-action="thisMonth">오늘</button></div>';
s+='<div class="calendar-filter-bar"><div class="category-filters">'+(state.eventCategories||[]).map(c=>`<button class="category-filter ${(state.hiddenEventCategories||[]).includes(c.name)?'off':''}" data-action="toggleEventCategory" data-name="${esc(c.name)}" aria-pressed="${!(state.hiddenEventCategories||[]).includes(c.name)}"><span class="category-line" style="color:${esc(c.color)}" aria-hidden="true"></span><span style="color:${esc(c.color)}">${esc(categoryLabel(c))}</span><span class="category-check" aria-hidden="true">${((state.hiddenEventCategories||[]).includes(c.name))?'':'✓'}</span></button>`).join('')+'</div><button type="button" class="category-manage" data-action="manageEventCategories" aria-label="일정 카테고리 관리" title="일정 카테고리 관리">카테고리</button></div>';
s+='<div class="calendar">'+calendarWeekdays().map(x=>`<div class="weekday ${x==='토'?'saturday':x==='일'?'sunday':''}">${x}</div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let n=1;n<=days;n++){let iso=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=sortedEvents(iso).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)),todos=dayTodos(iso).filter(t=>t.status!=='moved'),hasJ=!!state.journals[iso];s+=`<button class="day ${dateClass(iso)} ${iso===d?'selected':''} ${iso===todayISO()?'today':''} ${hasJ?'has-journal':''}" data-date="${iso}" title="${esc([holidayName(iso),hasJ?'일기 기록이 있는 날짜':''].filter(Boolean).join(' · '))}"><span class="num">${n}</span>${holidayLabelsHTML(iso)}<div class="day-events">${events.slice(0,3).map(ev=>{let c=categoryOf(ev),span=eventWindow(ev,iso);return `<span class="day-event-label" style="color:${esc(c.color)}" title="${esc(ev.title)} · ${esc(eventPeriodLabel(ev))}">${state.showCalendarEventTimes&&span.start&&span.start!=='00:00'?esc(span.start)+' ':''}${esc(ev.title)}</span>`}).join('')}${events.length>3?`<span class="day-more">+${events.length-3}개 일정</span>`:''}${todos.length?`<span class="day-todo-count">☑ 투두 ${todos.length}</span>`:''}</div></button>`}s+='</div><hr class="divider"><div class="row between"><div><h2>'+fmt(d)+'</h2></div><button class="btn secondary" data-action="newEvent">+ 일정</button></div><div class="calendar-lists"><section><h3 class="calendar-list-title">일정 <span class="muted small">'+sortedEvents(d).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)).length+'</span></h3><div class="stack">'+(sortedEvents(d).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)).length?sortedEvents(d).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)).map(eventItem).join(''):'<div class="empty">표시할 일정이 없습니다.</div>')+'</div></section><section><h3 class="calendar-list-title">☑ 투두 <span class="muted small">'+ async function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.70))};img.src=reader.result};reader.readAsDataURL(file)})}

function applyTheme(){const themes={rose:{accent:'#b77d72',soft:'#f7e9e4',bg:'#f7f3ee',panel:'#fffdf9'},sage:{accent:'#789681',soft:'#e8f0e9',bg:'#f3f6f1',panel:'#fcfdf9'},lavender:{accent:'#9284b5',soft:'#eee9f7',bg:'#f5f2f9',panel:'#fefcff'},sky:{accent:'#6f9eaf',soft:'#e5f1f4',bg:'#f1f6f7',panel:'#fcfefe'},butter:{accent:'#b49a52',soft:'#f5f0dc',bg:'#f8f6ed',panel:'#fffef9'},mono:{accent:'#777777',soft:'#ededed',bg:'#f4f4f2',panel:'#ffffff'}};let t=themes[state.themeColor]||themes.rose;let r=document.documentElement;r.style.setProperty('--accent',t.accent);r.style.setProperty('--accent-soft',t.soft);r.style.setProperty('--bg',t.bg);r.style.setProperty('--panel',t.panel);r.style.setProperty('--line',state.themeColor==='mono'?'#e5e5e3':`color-mix(in srgb,${t.accent} 12%,#eee5dc)`);let meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=t.accent;document.body.classList.remove('photo-small','photo-medium','photo-large','photos-off','font-default','font-soft','font-system');document.body.classList.add('photo-'+state.photoSize);if(!state.showPhotos)document.body.classList.add('photos-off');}
function modal(title,body){let old=$('#modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#20232b55;display:grid;place-items:center;padding:16px;z-index:20"><div class="panel" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div class="row between"><h2>${title}</h2><button class="iconbtn" type="button" data-action="closeModal">닫기</button></div><hr class="divider">${body}</div></div>`);bindForms()}

function helpModal(){modal('하루결 도움말',`<div class="help-content"><details open><summary>날짜와 캘린더</summary><p>오늘 화면의 작은 달력에서 날짜를 고르세요. 연도·월을 직접 선택할 수 있어요. 캘린더에는 일정과 투두 개수가 표시되고, 일기가 있는 날은 테마 색 테두리로 표시돼요.</p></details><details><summary>투두 · 일정 · 루틴</summary><p>투두의 동그라미를 눌러 완료·일부 완료·취소·이월을 선택하세요. 이월하면 이전 기록을 남기고 새 날짜에 연결해요. 일정은 시작일과 종료일로 기간을 정할 수 있어요. 종료일을 비우면 하루 일정이며, 시간·장소·메모는 선택 사항이에요. 카테고리별로 표시하거나 숨길 수 있어요. 루틴은 반복 요일과 기간에 따라 나타나며 선택한 날짜에 완료를 기록해요.</p></details><details><summary>일기 · 감정 · 식사 · 사진</summary><p>일기와 생활 기록은 필요한 항목만 작성하세요. 감정은 여러 개 선택할 수 있고 이모티콘을 누르면 바꿀 수 있어요. 식사 카드의 ‘메모 · 사진’을 열어 내용을 추가하세요. 사진은 용량을 줄여 저장하며, 저장한 사진을 누르면 크게 볼 수 있어요. 작성 후 ‘기록 저장’을 눌러 주세요.</p></details><details><summary>타임라인과 설정</summary><p>타임라인은 목록 또는 24시간 시간표로 볼 수 있어요. 타임라인 전용 항목은 캘린더 일정과 별도로 관리돼요. 설정에서 테마·사진 표시와 크기를 바꿀 수 있어요. 사진 숨기기는 사진을 삭제하지 않아요. 메뉴 순서는 중복 없이 고른 뒤 별도로 저장하세요.</p></details><details><summary>저장 · 백업 · 사이트 업데이트</summary><p>기록은 현재 기기의 브라우저에 저장됩니다. 다른 기기나 다른 주소에서는 자동으로 이어지지 않아요. 화면 아래 ‘백업 내려받기’로 JSON 파일을 보관하고 ‘백업 불러오기’로 옮길 수 있어요. 불러오기는 현재 기록을 교체하니 먼저 백업하세요.</p><p>사이트 파일 업데이트와 개인 기록 저장은 별개예요. 같은 사이트 주소와 브라우저를 유지하면 기존 기록을 계속 읽습니다. 업데이트 전에도 백업을 권장해요.</p></details></div>`)}

<div class="setting-section"><h3>사진 표시</h3>${choice('setPhotosVisible',[['on','사진 표시'],['off','사진 숨기기']],state.showPhotos?'on':'off')}</div>

<details class="setting-section setting-wide"><summary>감정별 색상</summary><div class="mood-color-grid">${[...moods.map(x=>x[1]),...(state.customMoodOptions||[]).map(x=>typeof x==='string'?x:x.name)].map(name=>`<div class="mood-color-item"><span>${moodEmoji(name)} ${esc(name)}</span><input type="color" data-mood-color="${esc(name)}" aria-label="${esc(name)} 색상" value="${moodColor(name)}"><button type="button" data-action="resetMoodColor" data-name="${esc(name)}">초기화</button></div>`).join('')}</div></details>
<div class="setting-section"><h3>캘린더 일정 시간</h3>${choice('setCalendarTimes',[['off','시간 숨기기'],['on','시간 표시']],state.showCalendarEventTimes?'on':'off')}</div>

<div class="setting-section"><h3>타임라인 표시 방식</h3>${choice('setTimelineMode',[['list','시간순 목록'],['day','24시간 시간표']],state.timelineMode)}</div>
<div class="setting-section"><h3>일정 카테고리 관리</h3><button type="button" class="btn secondary" data-action="manageEventCategories">카테고리 관리 열기</button></div>
<details class="setting-section setting-wide"><summary>메뉴 순서</summary><form id="navOrderForm" class="settings-list">${names.map(([v,l],i)=>`<div class="field"><label>${i+1}번째 메뉴</label><select name="nav${i}">${names.map(([ov,ol])=>`<option value="${ov}" ${(order[i]||names[i][0])===ov?'selected':''}>${ol}</option>`).join('')}</select></div>`).join('')}<div class="full"><button class="btn" style="width:100%">메뉴 순서 저장</button></div></form></details>
</div>`);const m=$('#modal');if(m){m.querySelector('.panel').style.width='min(720px,100%)';m.classList.add('settings-modal');m.querySelector('.panel').style.maxHeight='90vh'} }
function eventCategoryManager(){modal('일정 카테고리 관리',`<form id="categoryForm" class="stack"><div class="formgrid"><div class="field"><label>새 카테고리</label><input name="name" placeholder="예: 공부, 약속" required maxlength="32"></div><div class="field"><label>카테고리 색상</label><input type="color" name="color" value="#b77d72"></div><div class="field full"><label>아이콘</label><select name="icon">${categoryIconOptions({name:'기본'})}</select></div></div><button class="btn">카테고리 추가</button></form><div class="stack" style="margin-top:14px">${(state.eventCategories||[]).map(c=>`<div class="item category-edit-row"><span class="category-icon-preview" style="color:${esc(c.color)}">${eventPictogram(c)}</span><div class="body"><strong style="color:${esc(c.color)}">${esc(categoryLabel(c))}</strong></div><input type="color" data-category-color="${esc(c.name)}" value="${esc(c.color)}" aria-label="${esc(c.name)} 색상" style="width:44px;padding:2px;height:34px"><button class="iconbtn" data-action="deleteEventCategory" data-name="${esc(c.name)}" type="button">삭제</button><select class="category-icon-select" data-category-icon="${esc(c.name)}" aria-label="${esc(c.name)} 아이콘">${categoryIconOptions(c)}</select></div>`).join('')}</div><p class="small muted">카테고리를 삭제하면 그 카테고리의 일정은 첫 번째 카테고리로 이동해요.</p>`);}

function routineForm(r={}){modal(r.id?'루틴 수정':'새 루틴',`<form id="routineForm" class="stack"><input type="hidden" name="id" value="${r.id||''}"><div class="field"><label>루틴 이름</label><input name="title" required value="${esc(r.title||'')}" placeholder="예: 독서, 스트레칭"></div><div class="field"><label>반복 요일 (선택하지 않으면 매일)</label><div class="chips">${weekdays.map((d,i)=>`<label class="chip"><input type="checkbox" name="days" value="${i}" style="width:auto" ${(r.days||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="formgrid"><div class="field"><label>시작일</label><input type="date" name="startDate" value="${r.startDate||state.selectedDate}"></div><div class="field"><label>종료일 (선택)</label><input type="date" name="endDate" value="${r.endDate||''}"></div><div class="field"><label>실행 시간 (선택)</label><input type="time" name="time" value="${r.time||''}"><span class="small muted">시간을 비워 두면 시간표에 고정하지 않습니다.</span></div></div><button class="btn">저장</button></form>`)}

function routineHelp(){modal('루틴 설정 안내',`<p class="small muted">날짜별 완료 기록은 따로 저장됩니다. 루틴 설정을 바꾸더라도 기존 완료 기록은 유지됩니다.</p>`);const m=$('#modal');if(m)m.querySelector('.panel').style.width='min(340px,100%)';}
function bindForms(){let tf=$('#todoForm');if(tf)tf.onsubmit=e=>{e.preventDefault();let f=new FormData(tf),id=f.get('id'),obj={id:id||uid(),title:f.get('title').trim(),period:f.get('period'),section:f.get('section'),date:f.get('date'),time:f.get('time'),due:f.get('due'),status:'open'};if(id){let old=state.todos.find(x=>x.id===id);obj.status=old?.status||'open';obj.movedFrom=old?.movedFrom;obj.movedTo=old?.movedTo;state.todos=state.todos.map(x=>x.id===id?obj:x)}else state.todos.push(obj);save();$('#modal')?.remove();render();toast('투두를 저장했습니다.')};let ef=$('#eventForm');if(ef){const categoryInput=ef.querySelector('[name="category"]');categoryInput.onchange=()=>{categoryInput.style.color=(state.eventCategories.find(c=>c.name===categoryInput.value)||defaultEventCategory()).color};const dateInput=ef.querySelector('[name="date"]'),endDateInput=ef.querySelector('[name="endDate"]');dateInput.oninput=()=>{endDateInput.min=dateInput.value};ef.onsubmit=e=>{e.preventDefault();let f=new FormData(ef),id=f.get('id'),date=f.get('date'),endDate=f.get('endDate')||'',start=f.get('start')||'',end=f.get('end')||'';if(endDate&&endDate<date){toast('종료일은 시작일 이후로 선택해 주세요.');return}if((!endDate||endDate===date)&&start&&end&&end<start){toast('종료 시간은 시작 시간 이후로 선택해 주세요.');return}const old=id?state.events.find(x=>x.id===id):{};const obj={...old,id:id||uid(),title:f.get('title').trim(),date,endDate,location:(f.get('location')||'').trim(),note:(f.get('note')||'').trim(),category:f.get('category')||defaultEventCategory().name,start,end};if(id)state.events=state.events.map(x=>x.id===id?obj:x);else state.events.push(obj);state.selectedDate=obj.date;state.month=obj.date.slice(0,7);state.miniMonth=state.month;save();$('#modal')?.remove();render();toast('일정을 저장했습니다.')}};let xf=$('#timelineExtraForm');if(xf)xf.onsubmit=e=>{e.preventDefault();let f=new FormData(xf),id=f.get('id'),obj={id:id||uid(),title:f.get('title').trim(),date:f.get('date'),category:f.get('category').trim()||'개인 기록',start:f.get('start'),end:f.get('end'),color:f.get('color')||'#6576b8',note:f.get('note').trim()};if(id)state.timelineExtras=state.timelineExtras.map(x=>x.id===id?obj:x);else state.timelineExtras.push(obj);state.selectedDate=obj.date;state.month=obj.date.slice(0,7);save();$('#modal')?.remove();render();toast('타임라인 항목을 저장했습니다.')};let cf=$('#categoryForm');if(cf)cf.onsubmit=e=>{e.preventDefault();const f=new FormData(cf),name=(f.get('name')||'').trim(),color=f.get('color');if(!name)return;if(state.eventCategories.some(c=>c.name===name)){toast('같은 이름의 카테고리가 이미 있어요.');return}const icon=Object.hasOwn(EVENT_PICTOGRAMS,f.get('icon'))?f.get('icon'):'clock';state.eventCategories.push({name,color,icon});save();render();eventCategoryManager();toast('카테고리를 추가했습니다.')};let nf=$('#navOrderForm');if(nf)nf.onsubmit=e=>{e.preventDefault();let f=new FormData(nf),vals=[...Array(6)].map((_,i)=>f.get('nav'+i));if(new Set(vals).size!==6){toast('각 메뉴 순서를 중복 없이 선택해 주세요.');return}state.navOrder=vals;save();$('#modal')?.remove();render();toast('메뉴 순서를 저장했습니다.')};let rf=$('#routineForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let f=new FormData(rf),id=f.get('id'),old=state.routines.find(x=>x.id===id),obj={id:id||uid(),title:f.get('title').trim(),days:f.getAll('days').map(Number),startDate:f.get('startDate'),endDate:f.get('endDate'),time:f.get('time')};if(id)state.routines=state.routines.map(x=>x.id===id?obj:x);else state.routines.push(obj);save();$('#modal')?.remove();render();toast('루틴을 저장했습니다.')};let sf=$('#sectionForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf),name=f.get('section').trim();if(name&&!state.sections.includes(name)){state.sections.push(name);save();sectionManager();render();toast('섹션을 추가했습니다.')}};let jf=$('#journalForm');if(jf)jf.onsubmit=async e=>{e.preventDefault();let f=new FormData(jf),d=state.selectedDate,old=state.journals[d]||{},meals={};try{let diaryPhotos=[...(old.photos||[])];for(const file of (jf.querySelector('[name="journal-photos"]')?.files||[]))diaryPhotos.push(await compressPhoto(file));for(const m of ['아침','점심','저녁','간식']){let prev=mealData(old.meals?.[m]),photos=[...prev.photos];for(const file of (jf.querySelector(`[name="meal-photos-${m}"]`)?.files||[]))photos.push(await compressPhoto(file));meals[m]={status:f.get('meal-status-'+m)||'',food:(f.get('meal-food-'+m)||'').trim(),note:(f.get('meal-note-'+m)||'').trim(),photos}}const moodReasons={...(old.moodReasons||{})};state.journals[d]={...old,text:f.get('text').trim(),moods:[...journalMood],moodReasons,meals,photos:diaryPhotos,sleepHours:f.get('sleepHours')||'',steps:f.get('steps')||'',songTitle:(f.get('songTitle')||'').trim(),songArtist:(f.get('songArtist')||'').trim(),good:f.get('good').trim(),hard:f.get('hard').trim(),tomorrow:f.get('tomorrow').trim(),updatedAt:new Date().toISOString()};save();render();toast('오늘의 기록을 저장했습니다.')}catch(err){console.error(err);toast('사진을 처리하지 못했어요. 이미지 파일을 확인해 주세요.')}};let td=$('#timelineDate');if(td)td.onchange=()=>{state.selectedDate=td.value;state.month=td.value.slice(0,7);save();render()};let jd=$('#journalDate');if(jd)jd.onchange=()=>{state.selectedDate=jd.value;state.month=jd.value.slice(0,7);save();render()};let ws=$('#weekStartSelect');if(ws)ws.onchange=()=>{state.weekStart=ws.value==='mon'?'mon':'sun';save();render()};}

document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-nav-year],[data-nav-month]'))return;const scope=el.dataset.navYear||el.dataset.navMonth;const parent=el.closest('.month-navigator');const year=Number(parent.querySelector('[data-nav-year]').value),month=Number(parent.querySelector('[data-nav-month]').value);if(!Number.isInteger(year)||year<1900||year>2050||month<1||month>12)return;const value=year+'-'+String(month).padStart(2,'0');if(scope==='mini')state.miniMonth=value;else state.month=value;save();render()});
document.addEventListener('click',e=>{const emojiEdit=e.target.closest('[data-action="editMoodEmoji"]');if(emojiEdit){e.preventDefault();e.stopPropagation();const name=emojiEdit.dataset.name,emoji=prompt(`${name}에 사용할 이모티콘을 입력해 주세요.`,moodEmoji(name));if(emoji&&emoji.trim()){if((state.customMoodOptions||[]).some(x=>(typeof x==='string'?x:x.name)===name))state.customMoodEmojis[name]=emoji.trim();else state.moodEmojiOverrides[name]=emoji.trim();save();render()}return;}const removeMood=e.target.closest('[data-action="removeCustomMood"]');if(removeMood){e.preventDefault();e.stopPropagation();const n=removeMood.dataset.name;state.customMoodOptions=(state.customMoodOptions||[]).filter(x=>x!==n);journalMood=journalMood.filter(x=>x!==n);save();render();return;}let b=e.target.closest('button');if(!b)return;if(b.dataset.date){state.selectedDate=b.dataset.date;state.month=b.dataset.date.slice(0,7);state.miniMonth=state.month;save();render();return}if(b.dataset.period){todoFilter=b.dataset.period;render();return}if(b.dataset.section){todoSection=b.dataset.section;render();return}if(b.dataset.mood){let m=b.dataset.mood;journalMood=journalMood.includes(m)?journalMood.filter(x=>x!==m):[...journalMood,m];b.classList.toggle('chosen');b.setAttribute('aria-pressed',String(journalMood.includes(m)));return}if(b.dataset.status){let t=state.todos.find(x=>x.id===b.dataset.id);if(t){let ns=b.dataset.status;if(t.status==='moved'&&ns!=='moved'&&t.movedTo){let c=state.todos.find(x=>x.id===t.movedTo);if(c&&c.status==='open')del('todos',c.id);delete t.movedTo}t.status=ns;save();render();toast('투두 상태를 변경했습니다.')}return}let a=b.dataset.action,id=b.dataset.id;if(!a)return;let t=state.todos.find(x=>x.id===id),ev=state.events.find(x=>x.id===id),r=state.routines.find(x=>x.id===id);switch(a){case'openHelp':helpModal();break;case'newTodo':todoForm();break;case'editTodo':todoForm(t);break;case'deleteTodo':if(confirm('이 투두를 삭제할까요?')){del('todos',id);save();render()}break;case'move':if(t&&t.status==='moved'){toast('이미 이월한 투두예요.');break}if(t){let d=prompt('이월할 날짜를 입력하세요 (YYYY-MM-DD)',plusDays(t.date||state.selectedDate,1));if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){t.status='moved';let next={...t,id:uid(),date:d,status:'open',movedFrom:t.id,movedTo:undefined};t.movedTo=next.id;state.todos.push(next);state.selectedDate=d;state.month=d.slice(0,7);save();render();toast('기존 기록을 보존하고 새 날짜에 연결했습니다.')}}break;case'newEvent':eventForm();break;case'newTimelineExtra':timelineExtraForm();break;case'editTimelineExtra':timelineExtraForm((state.timelineExtras||[]).find(x=>x.id===id));break;case'deleteTimelineExtra':if(confirm('이 타임라인 항목을 삭제할까요?')){state.timelineExtras=state.timelineExtras.filter(x=>x.id!==id);save();render()}break;case'openSettings':settingsModal();break;case'setWeekStart':state.weekStart=b.dataset.value==='mon'?'mon':'sun';save();settingsModal();render();break;case'setCalendarTimes':state.showCalendarEventTimes=b.dataset.value==='on';save();settingsModal();render();break;case'setTimelineMode':state.timelineMode=b.dataset.value==='day'?'day':'list';save();settingsModal();render();break;case'setRoutineStatsPeriod':state.routineStatsPeriod=b.dataset.value==='month'?'month':'week';save();render();break;case'setThemeColor':state.themeColor=b.dataset.value;save();settingsModal();render();break;case'setPhotoSize':state.photoSize=b.dataset.value;save();settingsModal();render();break;case'setPhotosVisible':state.showPhotos=b.dataset.value==='on';save();settingsModal();render();break;case'resetMoodColor':delete state.moodColors[b.dataset.name];save();settingsModal();render();break;case'calendarCategoryFilters':toast('아래 카테고리 버튼을 눌러 표시 여부를 바꿀 수 있어요.');break;case'toggleEventCategory':{let n=b.dataset.name;state.hiddenEventCategories=state.hiddenEventCategories||[];state.hiddenEventCategories=state.hiddenEventCategories.includes(n)?state.hiddenEventCategories.filter(x=>x!==n):[...state.hiddenEventCategories,n];save();render();break;}case'addCustomMood':{let inp=$('#customMoodInput'),emojiInp=$('#customMoodEmojiInput'),name=(inp?.value||'').trim(),emoji=(emojiInp?.value||'').trim()||'✦';if(name&&!(state.customMoodOptions||[]).some(x=>(typeof x==='string'?x:x.name)===name)){state.customMoodOptions.push(name);state.customMoodEmojis[name]=emoji;journalMood=[...journalMood,name];save();render();}else if(name)toast('이미 추가한 감정이에요.');break;}case'editMoodEmoji':{let name=b.dataset.name,emoji=prompt(`${name}에 사용할 이모티콘을 입력해 주세요.`,moodEmoji(name));if(emoji&&emoji.trim()){if((state.customMoodOptions||[]).some(x=>(typeof x==='string'?x:x.name)===name))state.customMoodEmojis[name]=emoji.trim();else state.moodEmojiOverrides[name]=emoji.trim();save();render()}break;}case'removeJournalPhoto':{let j=state.journals[state.selectedDate];if(j&&Array.isArray(j.photos)){j.photos.splice(Number(b.dataset.index),1);save();b.closest('.photo-thumb')?.remove()}break;}case'removeMealPhoto':{let j=state.journals[state.selectedDate],md=j&&mealData(j.meals?.[b.dataset.meal]);if(j&&md){md.photos.splice(Number(b.dataset.index),1);j.meals[b.dataset.meal]=md;save();b.closest('.photo-thumb')?.remove()}break;}case'removeCustomMood':{let n=b.dataset.name;state.customMoodOptions=(state.customMoodOptions||[]).filter(x=>x!==n);journalMood=journalMood.filter(x=>x!==n);save();render();break;}case'manageEventCategories':eventCategoryManager();break;case'deleteEventCategory':{let name=b.dataset.name;if((state.eventCategories||[]).length>1&&confirm(`'${name}' 카테고리를 삭제할까요?`)){state.eventCategories=state.eventCategories.filter(c=>c.name!==name);state.events.forEach(e=>{if(e.category===name)e.category=state.eventCategories[0].name});save();eventCategoryManager();render()}else if((state.eventCategories||[]).length<=1)toast('카테고리는 최소 하나가 필요해요.');break}case'editEvent':eventForm(ev);break;case'deleteEvent':if(confirm('이 일정을 삭제할까요?')){del('events',id);save();render()}break;case'newRoutine':routineForm();break;case'editRoutine':routineForm(r);break;case'deleteRoutine':if(confirm('이 루틴을 삭제할까요?')){del('routines',id);save();render()}break;case'routineDone':if(r){state.routineLogs[r.id+'_'+state.selectedDate]={done:!rdone(r.id,state.selectedDate),updatedAt:Date.now()};save();render();toast('루틴 기록을 변경했습니다.')}break;case'miniPrevMonth':moveMonth(-1,true);break;case'miniNextMonth':moveMonth(1,true);break;case'prevMonth':{let d=new Date(state.month+'-15T12:00:00');d.setMonth(d.getMonth()-1);state.month=d.toISOString().slice(0,7);render();break}case'nextMonth':{let d=new Date(state.month+'-15T12:00:00');d.setMonth(d.getMonth()+1);state.month=d.toISOString().slice(0,7);render();break}case'thisMonth':state.month=todayISO().slice(0,7);state.selectedDate=todayISO();render();break;case'openCalendar':setView('calendar');break;case'openJournal':setView('journal');break;case'selectToday':state.selectedDate=todayISO();state.month=todayISO().slice(0,7);state.miniMonth=state.month;save();render();break;case'manageSections':sectionManager();break;case'routineHelp':routineHelp();break;case'statusMenu':{const wrap=b.closest('.status-wrap');const existing=wrap.querySelector('.status-menu');if(existing){existing.remove();break}$$('.status-menu').forEach(x=>x.remove());wrap.insertAdjacentHTML('beforeend',`<div class="status-menu"><button class="iconbtn" data-status="done" data-id="${id}">○ 완료</button><button class="iconbtn" data-status="partial" data-id="${id}">△ 일부 완료</button><button class="iconbtn" data-status="cancelled" data-id="${id}">× 취소</button>${t?.status!=='open'?`<button class="iconbtn" data-status="open" data-id="${id}">↺ 미완료</button>`:''}${t?.status!=='moved'?`<button class="iconbtn" data-action="move" data-id="${id}">→ 이월</button>`:''}</div>`);break;}case'renameSection':{let old=b.dataset.name,n=prompt('새 섹션 이름',old);if(n&&n.trim()&&!state.sections.includes(n.trim())){state.sections=state.sections.map(s=>s===old?n.trim():s);state.todos.forEach(t=>{if(t.section===old)t.section=n.trim()});save();render();if($('#modal'))sectionManager()}break}case'deleteSection':{let name=b.dataset.name;if(confirm(`'${name}' 섹션을 삭제할까요? 기존 투두는 미분류로 유지됩니다.`)){state.sections=state.sections.filter(s=>s!==name);state.todos.forEach(t=>{if(t.section===name)t.section=''});if(todoSection===name)todoSection='전체';save();render();if($('#modal'))sectionManager()}break}case'clearJournal':if(confirm('선택한 날짜의 일기·식사·생활 기록을 모두 삭제할까요?')){delete state.journals[state.selectedDate];save();render();toast('기록을 삭제했습니다.')}break;case'exportData':exportData();break;case'toggleClosed':state.hideClosed=!state.hideClosed;save();render();break;case'closeModal':$('#modal')?.remove();break}});

let imageGallery=[],imageIndex=0;
function showPhotoLightbox(src){if(!state.showPhotos)return;const images=[...document.querySelectorAll('.photo-strip img')].filter(img=>img.getAttribute('src')&&img.offsetParent!==null);imageGallery=images.map(x=>x.src);imageIndex=Math.max(0,imageGallery.indexOf(src));if(!imageGallery.length)imageGallery=[src];let old=$('#photoLightbox');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="photoLightbox" class="photo-lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기"><button class="lightbox-close" type="button" data-lightbox="close" aria-label="닫기">×</button><img id="fullPhoto" alt="확대한 사진"><div class="lightbox-toolbar"><button type="button" data-lightbox="prev" aria-label="이전 사진">〈 이전</button><span id="photoCounter"></span><button type="button" data-lightbox="next" aria-label="다음 사진">다음 〉</button></div></div>`);updatePhotoLightbox();}
function updatePhotoLightbox(){const img=$('#fullPhoto'),counter=$('#photoCounter');if(img)img.src=imageGallery[imageIndex]||'';if(counter)counter.textContent=`${imageIndex+1} / ${imageGallery.length}`;}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-lightbox]');if(btn){const act=btn.dataset.lightbox;if(act==='close')$('#photoLightbox')?.remove();else if(imageGallery.length){imageIndex=(imageIndex+(act==='next'?1:-1)+imageGallery.length)%imageGallery.length;updatePhotoLightbox()}return}if(e.target.id==='photoLightbox'){$('#photoLightbox')?.remove();return}const img=e.target.closest('.photo-strip img');if(img&&state.showPhotos){showPhotoLightbox(img.src)}});
document.addEventListener('keydown',e=>{if(!$('#photoLightbox'))return;if(e.key==='Escape')$('#photoLightbox')?.remove();if(e.key==='ArrowRight'&&imageGallery.length){imageIndex=(imageIndex+1)%imageGallery.length;updatePhotoLightbox()}if(e.key==='ArrowLeft'&&imageGallery.length){imageIndex=(imageIndex-1+imageGallery.length)%imageGallery.length;updatePhotoLightbox()}});
document.addEventListener('input',e=>{const inp=e.target;if(inp.matches('[data-mood-color]')){state.moodColors[inp.dataset.moodColor]=inp.value;save();render()}else if(inp.matches('[data-category-color]')){const category=state.eventCategories.find(c=>c.name===inp.dataset.categoryColor);if(category){category.color=inp.value;save();render()}}});
document.addEventListener('change',e=>{const input=e.target;if(!input.matches('[data-category-icon]')||!Object.hasOwn(EVENT_PICTOGRAMS,input.value))return;const category=state.eventCategories.find(c=>c.name===input.dataset.categoryIcon);if(category){category.icon=input.value;save();render();eventCategoryManager()}});
