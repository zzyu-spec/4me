/* Personalized display settings */
:root{--photo-edge:88px}
body.photo-small{--photo-edge:62px}body.photo-medium{--photo-edge:88px}body.photo-large{--photo-edge:146px}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{width:var(--photo-edge);height:var(--photo-edge);object-fit:cover}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{cursor:zoom-in;transition:transform .15s ease,box-shadow .15s ease}
.photo-strip .photo-preview:hover,.photo-strip .photo-thumb img:hover{transform:scale(1.035);box-shadow:0 4px 14px #0000001a}
body.photos-off .photo-strip,body.photos-off .photo-pick,body.photos-off .photo-help{display:none!important}
.photo-hidden-note{display:none;border:1px dashed var(--line);background:var(--accent-soft);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted)}
body.photos-off .photo-hidden-note{display:block}
.mood button{--mood-color:var(--accent)}
.mood button.chosen{background:color-mix(in srgb,var(--mood-color) 15%,white);border-color:color-mix(in srgb,var(--mood-color) 46%,white);color:color-mix(in srgb,var(--mood-color) 75%,#252525)}
.mood button:not(.chosen):hover{border-color:var(--mood-color)}
.chip.mood-badge{background:color-mix(in srgb,var(--mood-color) 14%,white);border-color:color-mix(in srgb,var(--mood-color) 45%,white);color:color-mix(in srgb,var(--mood-color) 70%,#292929)}
.mood-reason-card{border-left:3px solid var(--mood-color,var(--accent))}
.setting-section{padding:3px 0 6px}.setting-section h3{margin:0 0 6px;font-size:15px}.setting-section .sub{margin-bottom:10px}
.setting-divider{border:0;border-top:1px solid var(--line);margin:6px 0}
.mood-color-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mood-color-item{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.mood-color-item span{flex:1;min-width:0;font-size:12px}.mood-color-item input[type=color]{width:38px;min-width:38px;height:32px;padding:2px;cursor:pointer}
.mood-color-item button{background:var(--accent-soft);color:var(--accent);border-radius:8px;font-size:11px;padding:7px}
.settings-group{display:flex;gap:7px;flex-wrap:wrap}
.settings-group .chip{cursor:pointer}.settings-group .chip.active{border-color:var(--accent)}
.settings-footer{font-size:11px;color:var(--muted)}
.photo-lightbox{position:fixed;inset:0;z-index:120;background:#14151be8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:58px 18px 26px}

function holidayName(iso){return (KR_HOLIDAYS[iso]||[]).join(' · ')}
function holidayLabelsHTML(iso){return (KR_HOLIDAYS[iso]||[]).map(name=>{const parts=name==='부처님오신날'?['부처님','오신날']:name==='대체공휴일'?['대체','공휴일']:[name];return `<span class="holiday-name" title="${esc(parts.join(' '))}" aria-label="${esc(parts.join(' '))}"><span class="holiday-label holiday-desktop"><span class="holiday-text">${esc(name)}</span></span>${parts.map(part=>`<span class="holiday-label holiday-mobile"><span class="holiday-text">${esc(part)}</span></span>`).join('')}</span>`}).join('')}

function fitHolidayLabel(label){const text=label.firstElementChild;if(!text)return;const available=label.clientWidth,natural=text.offsetWidth;if(available&&natural)text.style.transform=`scaleX(${Math.min(1,available/natural)})`}
const holidayLabelObserver=typeof ResizeObserver==='function'?new ResizeObserver(entries=>entries.forEach(({target})=>fitHolidayLabel(target))):null;
function refreshHolidayLabels(){holidayLabelObserver?.disconnect();$$('.holiday-label').forEach(label=>{fitHolidayLabel(label);holidayLabelObserver?.observe(label)})}
window.addEventListener('resize',refreshHolidayLabels);

function dateClass(iso){const day=new Date(iso+'T12:00:00').getDay();return [day===0?'sunday':day===6?'saturday':'',holidayName(iso)?'holiday':''].join(' ')}
function monthNavigator(month,scope){let [y,m]=month.split('-').map(Number);return `<div class="month-navigator"><button type="button" class="iconbtn" data-action="${scope==='mini'?'miniPrevMonth':'prevMonth'}" aria-label="이전 달">‹</button><select aria-label="년도 선택" data-nav-year="${scope}">${Array.from({length:151},(_,i)=>1900+i).map(n=>`<option value="${n}" ${n===y?'selected':''}>${n}년</option>`).join('')}</select><select aria-label="월 선택" data-nav-month="${scope}">${Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===m?'selected':''}>${n}월</option>`).join('')}</select><button type="button" class="iconbtn" data-action="${scope==='mini'?'miniNextMonth':'nextMonth'}" aria-label="다음 달">›</button></div>`}
function moveMonth(delta,mini){let current=mini?(state.miniMonth||state.selectedDate.slice(0,7)):state.month;let [y,m]=current.split('-').map(Number),dt=new Date(y,m-1+delta,1,12),next=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');if(mini)state.miniMonth=next;else state.month=next;save();render()}

function calendarWeekdays(){return state.weekStart==='mon'?['월','화','수','목','금','토','일']:weekdays}function weekOffset(date){return (new Date(date).getDay()-(state.weekStart==='mon'?1:0)+7)%7}function miniCalendar(d){let displayMonth=state.miniMonth||d.slice(0,7);let [y,m]=displayMonth.split('-').map(Number),first=weekOffset(new Date(y,m-1,1)),days=new Date(y,m,0).getDate();let s=monthNavigator(displayMonth,'mini')+'<div class="calendar">'+calendarWeekdays().map(x=>`<div class="weekday ${x==='토'?'saturday':x==='일'?'sunday':''}">${x}</div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let n=1;n<=days;n++){let iso=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,has=dayEvents(iso).length||dayTodos(iso).length||state.journals[iso];s+=`<button class="day ${dateClass(iso)} ${iso===d?'selected':''} ${iso===todayISO()?'today':''}" data-date="${iso}"><span class="num">${n}</span>${holidayLabelsHTML(iso)}${has?'<br><span class="dot"></span>':''}</button>`}return s+'</div>'}
function defaultEventCategory(){return (state.eventCategories||[]).find(c=>c.name==='카테고리 미정'||c.name==='기본')||(state.eventCategories||[])[0]||{name:'기본',color:'#6576b8',colorMode:'theme'}}
function categoryLabel(category){return category.name==='기본'||category.name==='카테고리 미정'?'기본':category.name}
function categoryColor(category){const basic=category.name==='기본'||category.name==='카테고리 미정';return basic&&category.colorMode!=='custom'&&(category.colorMode==='theme'||!category.color||category.color==='#6576b8')?(document.documentElement.style.getPropertyValue('--accent')||'#b77d72'):category.color||'#6576b8'}
function categoryOf(e){return (state.eventCategories||[]).find(c=>c.name===(e.category||defaultEventCategory().name))||defaultEventCategory()}

function sortedEvents(date){return dayEvents(date).slice().sort((a,b)=>{let at=eventWindow(a,date).start||'99:99',bt=eventWindow(b,date).start||'99:99';return at.localeCompare(bt)||String(a.title).localeCompare(String(b.title),'ko')})}
function calendarTodoPreview(t){return `<div class="calendar-todo-preview"><span class="todo-preview-status">${statusSymbol(t.status)||'○'}</span><div class="todo-preview-title">${esc(t.title)}<div class="todo-preview-meta">${esc(t.time||'시간 미정')}${t.section?' · '+esc(t.section):''}${t.status&&t.status!=='open'?' · '+esc(statusLabel(t.status)):''}</div></div></div>`}
function calendarHTML(){let [y,m]=state.month.split('-').map(Number),d=state.selectedDate,first=weekOffset(new Date(y,m-1,1)),days=new Date(y,m,0).getDate();let s='<div class="panel calendar-panel"><div class="calendar-head">'+monthNavigator(state.month,'calendar')+'<button class="btn secondary calendar-today" data-action="thisMonth">오늘</button></div>';
s+='<div class="calendar-filter-bar"><div class="category-filters">'+(state.eventCategories||[]).map(c=>`<button class="category-filter ${(state.hiddenEventCategories||[]).includes(c.name)?'off':''}" data-action="toggleEventCategory" data-name="${esc(c.name)}" aria-pressed="${!(state.hiddenEventCategories||[]).includes(c.name)}"><span class="category-line" style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}" aria-hidden="true"></span><span style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}">${esc(categoryLabel(c))}</span><span class="category-check" style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}" aria-hidden="true">${((state.hiddenEventCategories||[]).includes(c.name))?'':'✓'}</span></button>`).join('')+'</div><button type="button" class="category-manage" data-action="manageEventCategories" aria-label="일정 카테고리 관리" title="일정 카테고리 관리">카테고리</button></div>';
s+=`<div class="calendar-display-options"><button class="chip" data-action="toggleCalendarAll" aria-pressed="${!!state.calendarShowAllEvents}">일정 ${state.calendarShowAllEvents?'모두 표시':'3개씩 표시'} ▾</button></div>`;s+='<div class="calendar">'+calendarWeekdays().map(x=>`<div class="weekday ${x==='토'?'saturday':x==='일'?'sunday':''}">${x}</div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let n=1;n<=days;n++){let iso=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=sortedEvents(iso).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)),todos=dayTodos(iso).filter(t=>t.status!=='moved'),hasJ=!!state.journals[iso];s+=`<button class="day ${dateClass(iso)} ${iso===d?'selected':''} ${iso===todayISO()?'today':''} ${hasJ?'has-journal':''}" data-date="${iso}" title="${esc([holidayName(iso),hasJ?'기록을 저장한 날짜':''].filter(Boolean).join(' · '))}"><span class="num">${n}</span>${holidayLabelsHTML(iso)}<div class="day-events">${events.slice(0,state.calendarShowAllEvents?events.length:3).map(ev=>{let c=categoryOf(ev),span=eventWindow(ev,iso);return `<span class="day-event-label" style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}" title="${esc(ev.title)} · ${esc(eventPeriodLabel(ev))}">${state.showCalendarEventTimes&&(span.start||span.end)?esc(timeRangeLabel(span.start,span.end))+' ':''}${esc(ev.title)}</span>`}).join('')}${!state.calendarShowAllEvents&&events.length>3?`<span class="day-more">+${events.length-3}개 일정</span>`:''}${todos.length?`<span class="day-todo-count">☑ 투두 ${todos.length}</span>`:''}</div></button>`}s+='</div><hr class="divider"><div class="row between"><div><h2>'+fmt(d)+'</h2></div><button class="btn secondary" data-action="newEvent">+ 일정</button></div><div class="calendar-lists"><section><h3 class="calendar-list-title">일정 <span class="muted small">'+sortedEvents(d).filter(ev=>!(state.hiddenEventCategories||[]).includes(categoryOf(ev).name)).length+'</span></h3><div class="stack">'+(sorte function todoForm(t={}){modal(t.id?'투두 수정':'새 투두',`<form id="todoForm" class="stack"><input type="hidden" name="id" value="${t.id||''}"><div class="field"><label>할 일</label><input name="title" required value="${esc(t.title||'')}" placeholder="예: 자료 조사하기"></div><div class="formgrid"><div class="field"><label>기간</label><select name="period">${[['daily','데일리'],['weekly','위클리'],['monthly','먼슬리']].map(([v,l])=>`<option value="${v}" ${(t.period||'daily')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>섹션</label><select name="section"><option value="">미분류</option>${state.sections.map(s=>`<option ${t.section===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>실행일 (오늘·캘린더 표시)</label><input type="date" name="date" value="${t.id?(t.date||''):state.selectedDate}"></div><div class="field"><label>시간 (선택)</label><input type="time" name="time" value="${t.time||''}"></div></div><div class="field"><label>마감일 (선택)</label><input type="date" name="due" value="${t.due||''}"></div>${repeatFields(t)}<button class="btn">저장</button></form>`)}
function eventCategoryPicker(e){return `<div class="event-category-picker" role="group" aria-label="일정 카테고리 선택">${state.eventCategories.map(c=>`<button type="button" class="category-pick ${(e.category||defaultEventCategory().name)===c.name?'selected':''}" data-pick-category="${esc(c.name)}" aria-pressed="${(e.category||defaultEventCategory().name)===c.name}" style="--pick-color:${esc(categoryColor(c))}"><span>${eventPictogram(c)}</span><small>${esc(categoryLabel(c))}</small></button>`).join('')}<button type="button" class="category-pick category-pick-add" data-toggle-category-add aria-label="카테고리 추가"><span>+</span><small>추가</small></button></div><div class="event-inline-category" hidden><div class="formgrid"><div class="field"><label>카테고리 이름</label><input name="newCategoryName" maxlength="32" placeholder="예: 공부"></div><div class="field"><label>색상</label><input type="color" name="newCategoryColor" value="#9284b5"></div><div class="field full"><label>아이콘</label>${categoryIconPalette('newCategoryIcon',{name:'기본'})}<select class="icon-palette-native" name="newCategoryIcon" tabindex="-1" aria-hidden="true">${categoryIconOptions({name:'기본'})}</select></div></div><button type="button" class="btn secondary" data-add-inline-category>카테고리 추가</button></div>`}
function finishEventEditor(){const m=$('#modal'),form=$('#eventForm');m.classList.add('event-editor-modal');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','일정 편집');const header=m.querySelector('.panel>.row');header.classList.add('event-editor-head');const close=header.querySelector('[data-action="closeModal"]');close.textContent='×';close.setAttribute('aria-label','일정 편집 닫기');const saveButton=Object.assign(document.createElement('button'),{type:'submit',className:'btn event-top-save',textContent:'저장'});saveButton.setAttribute('form','eventForm');header.appendChild(saveButton);const note=form.elements.note;note.addEventListener('input',()=>{$('#eventNoteCount').textContent=note.value.length});const select=form.elements.category;function pick(name){select.value=name;select.dispatchEvent(new Event('change',{bubbles:true}));form.querySelectorAll('[data-pick-category]').forEach(b=>{const on=b.dataset.pickCategory===name;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on)})}form.querySelectorAll('[data-pick-category]').forEach(b=>b.onclick=()=>pick(b.dataset.pickCategory));form.querySelector('[data-toggle-category-add]').onclick=()=>{const box=form.querySelector('.event-inline-category');box.hidden=!box.hidden};form.querySelector('[data-add-inline-category]').onclick=()=>{const name=form.elements.newCategoryName.value.trim(),color=form.elements.newCategoryColor.value,icon=form.elements.newCategoryIcon.value;if(!name)return;if(state.eventCategories.some(c=>c.name===name)){toast('같은 이름의 카테고리가 이미 있어요.');return}const category={name,color,icon,colorMode:'custom'};state.eventCategories.push(category);save();select.add(new Option(name,name));const add=form.querySelector('[data-toggle-category-add]'),button=document.createElement('button');button.type='button';button.className='category-pick';button.dataset.pickCategory=name;button.style.setProperty('--pick-color',color);button.innerHTML=`<span>${eventPictogram(category)}</span><small>${esc(name)}</small>`;button.onclick=()=>pick(name);add.before(button);pick(name);form.querySelector('.event-inline-category').hidden=true;form.elements.newCategoryName.value='';toast('카테고리를 추가했습니다.')};form.elements.newCategoryName.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();form.querySelector('[data-add-inline-category]').click()}});const allDay=form.elements.allDay;const updateAllDay=()=>{for(const name of ['start','end']){form.elements[name].disabled=allDay.checked;form.elements[name].required=!allDay.checked;form.elements[name].hidden=allDay.checked}document.querySelector('.quick-time-picker')?.remove();form.classList.toggle('is-all-day',allDay.checked)};allDay.onchange=updateAllDay;updateAllDay();select.addEventListener('change',()=>{form.querySelectorAll('[data-pick-category]').forEach(b=>{const on=b.dataset.pickCategory===select.value;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on)})})}
function eventForm(e={}){const date=e.date||state.selectedDate,h=new Date().getHours(),start=e.id?(e.start||''):String(h).padStart(2,'0')+':00',end=e.id?(e.end||''):String((h+1)%24).padStart(2,'0')+':00',endDate=e.endDate||(e.id||h<23?date:plusDays(date,1));modal(e.id?'일정 수정':'새 일정',`<form id="eventForm" class="stack event-form"><input type="hidden" name="id" value="${esc(e.id||'')}"><div class="field"><label for="eventTitle">일정 이름</label><input id="eventTitle" name="title" required value="${esc(e.title||'')}" placeholder="예: 여행, 수업, 약속"></div>${eventCategoryPicker(e)}<label class="event-all-day"><span>종일</span><input type="checkbox" name="allDay" ${e.allDay?'checked':''} role="switch" aria-label="종일 일정"></label><div class="event-datetime-group"><div class="event-datetime-row"><span id="eventStartLabel">시작</span><input id="eventStartDate" type="date" name="date" aria-label="시작일" required value="${esc(date)}"><input id="eventStartTime" type="time" name="start" aria-label="시작 시간" required value="${esc(start)}"></div><div class="event-datetime-row"><span id="eventEndLabel">종료</span><input id="eventEndDate" type="date" name="endDate" aria-label="종료일" required min="${esc(date)}" value="${esc(endDate)}"><input id="eventEndTime" type="time" name="end" aria-label="종료 시간" required value="${esc(end)}"></div></div><div class="field event-category-field"><label for="eventCategory">선택한 카테고리</label><select id="eventCategory" name="category" style="color:${esc(categoryColor(categoryOf(e)))}">${(state.eventCategories||[defaultEventCategory()]).map(c=>`<option value="${esc(c.name)}" style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}" ${(e.category||defaultEventCategory().name)===c.name?'selected':''}>${esc(categoryLabel(c))}</option>`).join('')}</select></div><div class="field"><label for="eventLocation">장소 · 선택</label><input id="eventLocation" name="location" value="${esc(e.location||'')}" placeholder="예: 학교, 회의실, 카페"></div><div class="field"><label for="eventNote">메모 · 선택</label><textarea id="eventNote" name="note" maxlength="${Math.max(200,String(e.note||'').length)}" placeholder="기억해 둘 내용을 적어 주세요.">${esc(e.note||'')}</textarea><small class="event-note-counter"><output id="eventNoteCount">${String(e.note||'').length}</output> / ${Math.max(200,String(e.note||'').length)}</small></div>${eventReminderFields(e)}${repeatFields(e)}<button class="btn">저장</button></form>`);finishEventEditor()}
