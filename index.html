/* Personalized display settings */
:root{--photo-edge:88px}
body.photo-small{--photo-edge:62px}body.photo-medium{--photo-edge:88px}body.photo-large{--photo-edge:146px}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{width:var(--photo-edge);height:var(--photo-edge);object-fit:cover}
.photo-strip .photo-preview,.photo-strip .photo-thumb img{cursor:zoom-in;transition:transform .15s ease,box-shadow .15s ease}
.photo-strip .photo-preview:hover,.photo-strip .photo-thumb img:hover{transform:scale(1.035);box-shadow:0 4px 14px #0000001a}
body.photos-off .photo-strip,body.photos-off .photo-pick,body.photos-off .photo-help{display:none!important}
.photo-hidden-note{display:none;border:1px dashed var(--line);background:var(--accent-soft);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted)}
body.photos-off .photo-hidden-note{display:block}
.mood button{--mood-color:var(--accent)}
.mood button.chosen{background:color-mix(in srgb,var(--mood-color) 15%,white);border-color:color-mix(in srgb,var(--mood-color) 46%,white);color:color-mix(in srgb,var(--mood-color) 75%,#252525)}
.mood button:not(.chosen):hover{border-color:var(--mood-color)}
.chip.mood-badge{background:color-mix(in srgb,var(--mood-color) 14%,white);border-color:color-mix(in srgb,var(--mood-color) 45%,white);color:color-mix(in srgb,var(--mood-color) 70%,#292929)}
.mood-reason-card{border-left:3px solid var(--mood-color,var(--accent))}
.setting-section{padding:3px 0 6px}.setting-section h3{margin:0 0 6px;font-size:15px}.setting-section .sub{margin-bottom:10px}
.setting-divider{border:0;border-top:1px solid var(--line);margin:6px 0}
.mood-color-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mood-color-item{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.mood-color-item span{flex:1;min-width:0;font-size:12px}.mood-color-item input[type=color]{width:38px;min-width:38px;height:32px;padding:2px;cursor:pointer}
.mood-color-item button{background:var(--accent-soft);color:var(--accent);border-radius:8px;font-size:11px;padding:7px}
.settings-group{display:flex;gap:7px;flex-wrap:wrap}
.settings-group .chip{cursor:pointer}.settings-group .chip.active{border-color:var(--accent)}
.settings-footer{font-size:11px;color:var(--muted)}
.photo-lightbox{position:fixed;inset:0;z-index:120;background:#14151be8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:58px 18px 26px}

function render(){if($('#itemActionMenu'))$('#modal')?.remove();applyTheme();updateHeaderDate();applyNavOrder();let root=$('#main');if(view==='home')root.innerHTML=homeHTML();if(view==='calendar')root.innerHTML=calendarHTML();if(view==='todos')root.innerHTML=todosHTML();if(view==='routines')root.innerHTML=routinesHTML();if(view==='timeline')root.innerHTML=timelineHTML();if(view==='journal')root.innerHTML=journalHTML();bindForms();if(view==='journal'){const ta=$('.journal-autogrow');if(ta)setupDiaryEditor(ta);$$('#journalForm input[type="file"]').forEach(i=>i.addEventListener('change',()=>renderPhotoInput(i)));}setupQuickAdd();decorateAddButtons();setupItemActions();if(view==='todos')setupTodoReorder();if(view==='routines'&&routineScreen!=='stats')setupTodoReorder('routine');refreshHolidayLabels();}
function applyNavOrder(){const nav=$('#nav');if(!nav)return;const names=['home','calendar','timeline','todos','journal','routines'];const order=[...(state.navOrder||[]).filter(x=>names.includes(x)),...names.filter(x=>!(state.navOrder||[]).includes(x))];order.forEach(v=>{const b=nav.querySelector(`[data-view="${v}"]`);if(b)nav.appendChild(b)});$$('#nav button[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
function homeSectionName(date,noun){const diff=dateDistance(todayISO(),date),word=({'-2':'그제','-1':'어제',0:'오늘',1:'내일',2:'모레'})[diff];return word?word+'의 '+noun:todoDisplayDate(date)+' '+noun}
function eventHasEnded(event,now=new Date()){const [y,m,d]=eventEndDate(event).split('-').map(Number);if(!y||!m||!d)return false;const timed=!event.allDay&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(event.end||'');const [h,min]=timed?event.end.split(':').map(Number):[0,0];const end=new Date(y,m-1,d+(timed?0:1),h,min);return now.getTime()>=end.getTime()}
function homeEventProgress(events,now=new Date()){const past=events.filter(e=>eventHasEnded(e,now)).length;return {past,total:events.length,percent:events.length?past/events.length*100:0}}
function updateHomeEventProgress(){if(view!=='home')return;const count=$('#homeEventCount'),bar=$('#homeEventProgress');if(!count||!bar)return;const p=homeEventProgress(dayEvents(state.selectedDate));count.textContent=p.past+'/'+p.total;bar.setAttribute('aria-valuenow',String(p.percent));bar.setAttribute('aria-valuetext',`지난 일정 ${p.past}개 / 전체 ${p.total}개`);bar.querySelector('span').style.width=p.percent+'%'}
setInterval(updateHomeEventProgress,30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateHomeEventProgress()});window.addEventListener('pageshow',updateHomeEventProgress);
function homeSortedTodos(date){return dayTodos(date).map((item,index)=>({item,index})).sort((a,b)=>Number(b.item.status==='done')-Number(a.item.status==='done')||(a.item.status==='done'&&b.item.status==='done'?((Number(a.item.completedAt)||Number(a.item.updatedAt)||0)-(Number(b.item.completedAt)||Number(b.item.updatedAt)||0)):0)||a.index-b.index).map(x=>x.item)}
function homeHTML(){let d=state.selectedDate,ts=homeSortedTodos(d),rs=dayRoutines(d),ev=dayEvents(d),act=ts.filter(t=>t.status!=='cancelled'&&t.status!=='moved'),done=act.filter(t=>t.status==='done').length,eventProgress=homeEventProgress(ev);return `<div class="layout"><section class="panel home-main"><div class="home-date-head"><button type="button" class="iconbtn" data-action="homePrevDay" aria-label="이전 날짜">‹</button><div><h2>${relativeDayLabel(d)}</h2><label class="home-inline-date"><span>${fmt(d)}</span><input id="homeDate" type="date" value="${esc(d)}" aria-label="홈 날짜 선택"></label></div><button type="button" class="iconbtn" data-action="homeNextDay" aria-label="다음 날짜">›</button></div>${d!==todayISO()?'<button class="btn secondary home-return-today" data-action="selectToday">오늘로</button>':''}<div class="row home-summary" style="gap:8px;margin-bottom:18px"><div class="panel" style="box-shadow:none"><div class="muted small">일정</div><strong id="homeEventCount">${eventProgress.past}/${eventProgress.total}</strong><div id="homeEventProgress" class="progress schedule-summary-line" role="progressbar" aria-label="지난 일정 비율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${eventProgress.percent}" aria-valuetext="지난 일정 ${eventProgress.past}개 / 전체 ${eventProgress.total}개"><span style="width:${eventProgress.percent}%"></span></div></div><div class="panel" style="box-shadow:none"><div class="muted small">투두</div><strong>${done}/${act.length}</strong><div class="progress"><span style="width:${act.length?done/act.length*100:0}%"></span></div></div><div class="panel" style="box-shadow:none"><div class="muted small">루틴</div><strong>${rs.filter(r=>rdone(r.id,d)).length}/${rs.length}</strong><div class="progress"><span style="width:${rs.length?rs.filter(r=>rdone(r.id,d)).length/rs.length*100:0}%"></span></div></div></div><div class="sectionhead">${esc(homeSectionName(d,'일정'))} <button class="btn secondary" data-action="newEvent">+ 일정</button></div>${ev.length?ev.sort((a,b)=>(a.start||'').localeCompare(b.start||'')).map(homeEventItem).join(''):'<div class="empty">등록된 일정이 없습니다.</div>'}<div class="sectionhead">${esc(homeSectionName(d,'투두'))} <button class="btn secondary" data-action="newTodo">+ 투두</button></div>${ts.length?ts.map(t=>todoItem(t,'home')).join(''):'<div class="empty">오늘 배정된 투두가 없습니다.</div>'}</section><aside class="stack"><section class="panel"><div class="row between"><h2>루틴</h2><button class="btn secondary" data-action="newRoutine">+ 루틴</button></div>${rs.length?rs.map(r=>routineItem(r)).join(''):'<div class="empty">등록된 루틴이 없습니다.</div>'}</section></aside></div>`}

function sleepFieldHTML(j){const minutes=sleepMinutes(j);return `<div class="field sleep-record-field"><label>수면 시간</label><input type="hidden" name="sleepHours" value="${esc(j.sleepHours??'')}"><input type="hidden" name="sleepStart" value="${esc(j.sleepStart||'')}"><input type="hidden" name="sleepEnd" value="${esc(j.sleepEnd||'')}"><input type="hidden" name="sleepFullDay" value="${Boolean(j.sleepFullDay)}"><button type="button" id="sleepRecordButton" class="sleep-record-button" data-action="openSleepEditor">${minutes===null?'수면 기록':sleepDurationLabel(minutes)}</button><span id="sleepTimeCaption" class="sleep-time-caption">${j.sleepStart&&j.sleepEnd?esc(timeRangeLabel(j.sleepStart,j.sleepEnd)):''}</span></div>`}
function journalWellbeingHTML(j){const minutes=sleepMinutes(j),steps=j.steps!==undefined&&j.steps!=='';return minutes!==null||steps?`<div class="sectionhead">생활 기록</div><div class="chips">${minutes!==null?`<span class="chip">🌙 ${sleepDurationLabel(minutes)}</span>`:''}${steps?`<span class="chip">👟 ${Number(j.steps).toLocaleString('ko-KR')}걸음</span>`:''}</div>`:''}
function openSleepEditor(){const date=state.selectedDate,j=state.journals[date]||{},existing=sleepMinutes(j),toMinutes=value=>{const [h,m]=value.split(':').map(Number);return h*60+m},toTime=value=>String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');let start=/^\d{2}:\d{2}$/.test(j.sleepStart||'')?toMinutes(j.sleepStart):22*60,end=/^\d{2}:\d{2}$/.test(j.sleepEnd||'')?toMinutes(j.sleepEnd):(22*60+(existing??480))%1440,fullDay=Boolean(j.sleepFullDay)||(existing===1440&&start===end),dragging=null;
const duration=()=>fullDay?1440:(end-start+1440)%1440;
let ticks='',numbers='';for(let h=0;h<24;h++){const angle=h/24*2*Math.PI-Math.PI/2,x=r=>120+Math.cos(angle)*r,y=r=>120+Math.sin(angle)*r;ticks+=`<line x1="${x(79)}" y1="${y(79)}" x2="${x(h%2?83:86)}" y2="${y(h%2?83:86)}"/>`;if(h%2===0)numbers+=`<text x="${x(68)}" y="${y(68)+3}">${h}</text>`}
modal('수면 기록',`<form id="sleepForm" class="sleep-editor"><svg id="sleepDial" class="sleep-dial" viewBox="0 0 240 240" role="group" aria-label="24시간 수면 다이얼"><circle class="sleep-track" cx="120" cy="120" r="96"/><circle id="sleepArc" class="sleep-arc" cx="120" cy="120" r="96" pathLength="1440" transform="rotate(-90 120 120)"/><g class="sleep-ticks">${ticks}</g><g class="sleep-numbers">${numbers}</g><text class="sleep-center-label" x="120" y="108">수면 시간</text><text id="sleepDuration" class="sleep-duration" x="120" y="137"></text><g id="sleepStartHandle" data-sleep-handle="start" class="sleep-handle" role="slider" tabindex="0" aria-label="취침 시각" aria-valuemin="0" aria-valuemax="1439"><circle r="14"/><svg x="-9" y="-9" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 18V7m0 7h18v4M3 10h6v4m0-4h9a3 3 0 0 1 3 3v1"/></svg></g><g id="sleepEndHandle" data-sleep-handle="end" class="sleep-handle wake" role="slider" tabindex="0" aria-label="기상 시각" aria-valuemin="0" aria-valuemax="1439"><circle r="14"/><svg x="-9" y="-9" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M3 5l3-3m12 0 3 3M7 20l-2 2m12-2 2 2"/></svg></g></svg><div class="sleep-time-fields"><label><span>취침</span><input id="sleepStartInput" type="time" required step="60" aria-label="취침 시각"></label><label><span>기상</span><input id="sleepEndInput" type="time" required step="60" aria-label="기상 시각"></label></div><p class="sleep-dial-hint">손잡이를 돌리거나 시각을 눌러 조절하세요.</p><div class="sleep-editor-actions"><button type="button" class="btn ghost" data-action="closeModal">취소</button><button type="submit" class="btn">확인</button></div>${existing!==null?'<button type="button" id="sleepClear" class="sleep-clear">수면 기록 지우기</button>':''}</form>`);
const form=$('#sleepForm'),svg=$('#sleepDial'),startInput=$('#sleepStartInput'),endInput=$('#sleepEndInput');
function update(syncInputs=true){const minutes=duration();$('#sleepDuration').textContent=sleepDurationLabel(minutes);$('#sleepArc').setAttribute('stroke-dasharray',minutes+' '+(1440-minutes));$('#sleepArc').setAttribute('stroke-dashoffset',-start);for(const [key,value] of [['Start',start],['End',end]]){const angle=value/1440*2*Math.PI-Math.PI/2,node=$('#sleep'+key+'Handle');node.setAttribute('transform',`translate(${120+96*Math.cos(angle)} ${120+96*Math.sin(angle)})`);node.setAttribute('aria-valuenow',value);node.setAttribute('aria-valuetext',toTime(value))}if(syncInputs){startInput.value=toTime(start);endInput.value=toTime(end)}}
function setValue(key,value){if(key==='start')start=value;else end=value;fullDay=false;update()}
function pointerValue(e){const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*240-120,y=(e.clientY-r.top)/r.height*240-120;return {minutes:(Math.round((((Math.atan2(y,x)+Math.PI/2+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*1440)/5)*5)%1440,radius:Math.hypot(x,y)}}
svg.addEventListener('pointerdown',e=>{const point=pointerValue(e),handle=e.target.closest('[data-sleep-handle]');if(!handle&&(point.radius<84||point.radius>115))return;const distance=(a,b)=>Math.min(Math.abs(a-b),1440-Math.abs(a-b));dragging=handle?.dataset.sleepHandle||(distance(point.minutes,start)<distance(point.minutes,end)?'start':'end');svg.setPointerCapture(e.pointerId);setValue(dragging,point.minutes);e.preventDefault()});svg.addEventListener('pointermove',e=>{if(dragging){setValue(dragging,pointerValue(e).minutes);e.preventDefault()}});for(const name of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(name,()=>{dragging=null});
for(const node of [$('#sleepStartHandle'),$('#sleepEndHandle')])node.addEventListener('keydown',e=>{const key=node.dataset.sleepHandle,current=key==='start'?start:end;let next;if(['ArrowRight','ArrowUp'].includes(e.key))next=(current+5)%1440;else if(['ArrowLeft','ArrowDown'].includes(e.key))next=(current+1435)%1440;else if(e.key==='PageUp')next=(current+60)%1440;else if(e.key==='PageDown')next=(current+1380)%1440;else if(e.key==='Home')next=0;else if(e.key==='End')next=1439;else return;e.preventDefault();setValue(key,next)});
for(const [input,key] of [[startInput,'start'],[endInput,'end']])input.addEventListener('input',()=>{if(/^\d{2}:\d{2}$/.test(input.value)){if(key==='start')start=toMinutes(input.value);else end=toMinutes(input.value);fullDay=false;update(false)}});
function commit(clear=false){if(state.selectedDate!==date){toast('날짜가 바뀌어 수면 기록을 저장하지 않았어요.');return}const previous=state.journals[date],minutes=duration(),values=clear?{sleepHours:'',sleepStart:'',sleepEnd:'',sleepFullDay:false}:{sleepHours:String(minutes/60),sleepStart:toTime(start),sleepEnd:toTime(end),sleepFullDay:fullDay};state.journals[date]={...(previous||{}),...values,updatedAt:new Date().toISOString()};if(save()===false){if(previous)state.journals[date]=previous;else delete state.journals[date];return}const journalForm=$('#journalForm');if(journalForm)for(const [name,value] of Object.entries(values)){const input=journalForm.elements.namedItem(name);if(input)input.value=String(value)}const button=$('#sleepRecordButton');if(button)button.textContent=clear?'수면 기록':sleepDurationLabel(minutes);const caption=$('#sleepTimeCaption');if(caption)caption.textContent=clear?'':timeRangeLabel(values.sleepStart,values.sleepEnd);const preview=$('#journalWellbeingPreview');if(preview)preview.innerHTML=journalWellbeingHTML(state.journals[date]);$('#modal')?.remove();button?.focus();toast(clear?'수면 기록을 지웠어요.':'수면 기록을 저장했어요.')}
form.onsubmit=e=>{e.preventDefault();if(form.reportValidity())commit()};const clear=$('#sleepClear');if(clear)clear.onclick=()=>{if(confirm('이 날짜의 수면 기록만 지울까요?'))commit(true)};update();}
let journalScreen='menu',journalBrowseMonth=null;
const JOURNAL_MAIN_MOODS=['행복함','평온함','피곤함','우울함','슬픔'];
function journalFace(name){if(JOURNAL_MAIN_MOODS.includes(name)){const index=JOURNAL_MAIN_MOODS.indexOf(name),colors=['#b0c0ad','#fff2e5','#f0f0ef','#e7effe','#f1eafa'],eyes=index===0?'<path d="M16 26a4 4 0 0 1 8 0m16 0a4 4 0 0 1 8 0"/>':index===4?'<path d="M16 25a4 4 0 0 0 8 0m16 0a4 4 0 0 0 8 0"/>':'<circle cx="22" cy="28" r="2.4" fill="currentColor" stroke="none"/><circle cx="42" cy="28" r="2.4" fill="currentColor" stroke="none"/>',mouth=index===0?'<path d="M23 35a9 9 0 0 0 18 0"/>':index===1?'<path d="M26 36a6 6 0 0 0 12 0"/>':index===2?'<path d="M27 38h10"/>':'<path d="M26 42a6 6 0 0 1 12 0"/>',tear=index===4?'<path d="M49 33c-1 4-5 8-5 11a5 5 0 0 0 10 0c0-3-4-7-5-11Z" fill="#7ca7e4" stroke="none"/>':'';return `<span class="journal-face journal-reference-face" style="--face-fill:${colors[index]}" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="31" fill="${colors[index]}" stroke="none"/>${eyes}${mouth}${tear}</svg></span>`}const custom=state.moodEmojiOverrides?.[name]||state.customMoodEmojis?.[name];if(custom||!moods.some(m=>m[1]===name))return `<span class="journal-face journal-face-emoji" aria-hidden="true">${esc(custom||moodEmoji(name))}</span>`;const eyes={happy:'<path d="M18 26q4-7 8 0m12 0q4-7 8 0"/>',dots:'<circle cx="22" cy="26" r="2.2" fill="currentColor" stroke="none"/><circle cx="42" cy="26" r="2.2" fill="currentColor" stroke="none"/>',closed:'<path d="M18 25q4 7 8 0m12 0q4 7 8 0"/>',tired:'<path d="M18 26h8m12 0h8"/>',stress:'<path d="m18 22 8 8m0-8-8 8m20-8 8 8m0-8-8 8"/>'};let eye=eyes.dots,mouth='<path d="M23 38q9 13 18 0"/>',extra='';if(['행복함','즐거움','설렘'].includes(name)){eye=name==='행복함'?eyes.happy:eyes.dots;mouth='<path d="M22 36h20c-1 17-19 17-20 0Z" fill="currentColor" stroke="none"/>'}if(name==='뿌듯함'){eye=eyes.closed;mouth='<path d="M25 39q8 6 16-1"/>'}if(name==='피곤함'){eye=eyes.tired;mouth='<path d="M25 40h14"/>'}if(name==='졸림'){eye=eyes.closed;mouth='<ellipse cx="32" cy="40" rx="3" ry="4"/>'}if(['우울함','불안함','슬픔','화남'].includes(name))mouth='<path d="M23 43q9-13 18 0"/>';if(name==='슬픔'){eye=eyes.closed;extra='<path d="M48 35c-1 4-5 7-5 10a5 5 0 0 0 10 0c0-3-4-6-5-10Z" fill="#6f9bd0" stroke="none"/>'}if(name==='불안함')extra='<path d="m18 19 8 2m12 0 8-2"/>';if(name==='화남')extra='<path d="m17 18 10 4m10 0 10-4"/>';if(name==='스트레스'){eye=eyes.stress;mouth='<path d="M24 40q4-5 8 0t8 0"/>'}return `<span class="journal-face" style="--face-color:${esc(moodColor(name))}" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle class="journal-face-disc" cx="32" cy="32" r="31" stroke="none"/>${eye}${mouth}${extra}</svg></span>`}

async function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.70))};img.src=reader.result};reader.readAsDataURL(file)})}

function finishEventEditor(){const m=$('#modal'),form=$('#eventForm');m.classList.add('event-editor-modal');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','일정 편집');const header=m.querySelector('.panel>.row');header.classList.add('event-editor-head');const saveButton=Object.assign(document.createElement('button'),{type:'submit',className:'btn event-top-save',textContent:'저장'});saveButton.setAttribute('form','eventForm');header.insertBefore(saveButton,header.querySelector('.modal-close'));const note=form.elements.note;note.addEventListener('input',()=>{$('#eventNoteCount').textContent=note.value.length});const select=form.elements.category;function pick(name){select.value=name;select.dispatchEvent(new Event('change',{bubbles:true}));form.querySelectorAll('[data-pick-category]').forEach(b=>{const on=b.dataset.pickCategory===name;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on)})}form.querySelectorAll('[data-pick-category]').forEach(b=>b.onclick=()=>pick(b.dataset.pickCategory));form.querySelector('[data-toggle-category-add]').onclick=()=>{const box=form.querySelector('.event-inline-category');box.hidden=!box.hidden};form.querySelector('[data-add-inline-category]').onclick=()=>{const name=form.elements.newCategoryName.value.trim(),color=form.elements.newCategoryColor.value,icon=form.elements.newCategoryIcon.value;if(!name)return;if(state.eventCategories.some(c=>c.name===name)){toast('같은 이름의 카테고리가 이미 있어요.');return}const category={name,color,icon,colorMode:'custom'};state.eventCategories.push(category);save();select.add(new Option(name,name));const add=form.querySelector('[data-toggle-category-add]'),button=document.createElement('button');button.type='button';button.className='category-pick';button.dataset.pickCategory=name;button.style.setProperty('--pick-color',color);button.innerHTML=`<span>${eventPictogram(category)}</span><small>${esc(name)}</small>`;button.onclick=()=>pick(name);add.before(button);pick(name);form.querySelector('.event-inline-category').hidden=true;form.elements.newCategoryName.value='';toast('카테고리를 추가했습니다.')};form.elements.newCategoryName.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();form.querySelector('[data-add-inline-category]').click()}});const allDay=form.elements.allDay;const updateAllDay=()=>{for(const name of ['start','end']){form.elements[name].disabled=allDay.checked;form.elements[name].required=!allDay.checked;form.elements[name].hidden=allDay.checked;form.elements[name].classList.toggle('hidden',allDay.checked)}document.querySelector('.quick-time-picker')?.remove();form.classList.toggle('is-all-day',allDay.checked)};allDay.onchange=updateAllDay;updateAllDay();select.addEventListener('change',()=>{form.querySelectorAll('[data-pick-category]').forEach(b=>{const on=b.dataset.pickCategory===select.value;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on)})})}
function eventForm(e={}){const date=e.date||state.selectedDate,h=new Date().getHours(),start=e.id?(e.start||''):String(h).padStart(2,'0')+':00',end=e.id?(e.end||''):String((h+1)%24).padStart(2,'0')+':00',endDate=e.endDate||(e.id||h<23?date:plusDays(date,1));modal(e.id?'일정 수정':'새 일정',`<form id="eventForm" class="stack event-form"><input type="hidden" name="id" value="${esc(e.id||'')}"><div class="field"><label for="eventTitle">일정 이름</label><input id="eventTitle" name="title" required value="${esc(e.title||'')}" placeholder="예: 여행, 수업, 약속"></div>${eventCategoryPicker(e)}<label class="event-all-day"><span>종일</span><input type="checkbox" name="allDay" ${e.allDay?'checked':''} role="switch" aria-label="종일 일정"></label><div class="event-datetime-group"><div class="event-datetime-row"><span id="eventStartLabel">시작</span><input id="eventStartDate" type="date" name="date" aria-label="시작일" required value="${esc(date)}"><input id="eventStartTime" type="time" name="start" aria-label="시작 시간" required value="${esc(start)}"></div><div class="event-datetime-row"><span id="eventEndLabel">종료</span><input id="eventEndDate" type="date" name="endDate" aria-label="종료일" required min="${esc(date)}" value="${esc(endDate)}"><input id="eventEndTime" type="time" name="end" aria-label="종료 시간" required value="${esc(end)}"></div></div><div class="field event-category-field"><label for="eventCategory">선택한 카테고리</label><select id="eventCategory" name="category" style="color:${esc(categoryColor(categoryOf(e)))}">${(state.eventCategories||[defaultEventCategory()]).map(c=>`<option value="${esc(c.name)}" style="--label-color:${esc(categoryColor(c))};color:${esc(categoryColor(c))}" ${(e.category||defaultEventCategory().name)===c.name?'selected':''}>${esc(categoryLabel(c))}</option>`).join('')}</select></div><div class="field"><label for="eventLocation">장소 · 선택</label><input id="eventLocation" name="location" value="${esc(e.location||'')}" placeholder="예: 학교, 회의실, 카페"></div><div class="field"><label for="eventNote">메모 · 선택</label><textarea id="eventNote" name="note" maxlength="${Math.max(200,String(e.note||'').length)}" placeholder="기억해 둘 내용을 적어 주세요.">${esc(e.note||'')}</textarea><small class="event-note-counter"><output id="eventNoteCount">${String(e.note||'').length}</output> / ${Math.max(200,String(e.note||'').length)}</small></div>${repeatFields(e)}${eventReminderFields(e)}<button class="btn">저장</button></form>`);finishEventEditor()}

function timelineCategoryForm(old=''){const c=state.timelineCategories.find(c=>c.name===old)||{name:'',color:'#789681',icon:'clock'};modal(old?'카테고리 수정':'카테고리 추가',`<form id="timelineCategoryForm" class="stack"><div class="field"><label>이름</label><input name="name" required maxlength="60" value="${esc(c.name)}"></div><div class="field"><label>색상</label><input type="color" name="color" value="${esc(c.color)}"></div><div class="field"><label>아이콘</label><input type="hidden" name="icon" value="${esc(c.icon||'clock')}">${categoryIconPalette('icon',c)}</div><button class="btn">저장</button></form>`);$('#timelineCategoryForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;if(state.timelineCategories.some(c=>c.name===name&&c.name!==old)){toast('같은 이름의 카테고리가 있습니다.');return}const item={...c,name,color:f.get('color'),icon:f.get('icon')};if(old){state.timelineCategories=state.timelineCategories.map(c=>c.name===old?item:c);state.timelineExtras.forEach(x=>{if(x.category===old)x.category=name})}else state.timelineCategories.push(item);save();render();timelineCategoryManager()}}

function activityDurationLabel(value){return [Math.floor(value/60)?Math.floor(value/60)+'시간':'',value%60?value%60+'분':''].filter(Boolean).join(' ')}
function timelineTimeFieldsHTML(x){return `<section class="field full activity-time-section"><div class="row between"><label>시간</label><button type="button" class="iconbtn" data-activity-now>현재 시각</button></div><div class="activity-direct-times"><label>시작<input type="time" name="start" step="300" value="${esc(x.start||'')}" aria-label="활동 시작 시각"></label><label>종료<input type="time" name="end" step="300" value="${esc(x.end||'')}" aria-label="활동 종료 시각"></label></div><div class="row between"><label>소요시간</label><button type="button" class="iconbtn" data-activity-clear>시간 지정 안 함</button></div><div class="activity-duration-wheel" role="group" aria-label="소요시간">${[5,10,15,20,25,30,45,60,90,120,180].map(minutes=>`<button type="button" data-activity-duration="${minutes}" aria-pressed="false">${activityDurationLabel(minutes)}</button>`).join('')}</div><span class="activity-time-status small muted" role="status" aria-live="polite"></span></section>`}
function bindTimelineTimePicker(form){const start=form.elements.start,end=form.elements.end,durationWheel=form.querySelector('.activity-duration-wheel'),status=form.querySelector('.activity-time-status');if(!durationWheel)return;const minutes=value=>{const parts=value.split(':').map(Number);return parts[0]*60+parts[1]},format=value=>String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');let duration=start.value&&end.value&&minutes(end.value)>minutes(start.value)?minutes(end.value)-minutes(start.value):25,timer=null,userScrolling=false;const refresh=()=>{clearTimeout(timer);userScrolling=false;start.step=start.value&&minutes(start.value)%5?'60':'300';end.step=end.value&&minutes(end.value)%5?'60':'300';const actual=start.value&&end.value?minutes(end.value)-minutes(start.value):0;durationWheel.querySelectorAll('button').forEach(button=>{const selected=actual===Number(button.dataset.activityDuration);button.classList.toggle('is-selected',selected);button.setAttribute('aria-pressed',String(selected))});status.textContent=actual>0?'소요시간 '+activityDurationLabel(actual):'';const selected=durationWheel.querySelector('.is-selected');if(selected){const r=selected.getBoundingClientRect(),box=durationWheel.getBoundingClientRect();durationWheel.scrollLeft+=r.left-box.left-(durationWheel.clientWidth-r.width)/2}};const chooseStart=value=>{if(minutes(value)+duration>=1440){status.textContent='자정을 넘지 않는 소요시간을 선택해 주세요.';return}start.value=value;end.value=format(minutes(value)+duration);refresh()};durationWheel.onclick=e=>{const button=e.target.closest('[data-activity-duration]');if(!button)return;const candidate=Number(button.dataset.activityDuration),now=new Date(),base=start.value||format(Math.floor((now.getHours()*60+now.getMinutes())/5)*5);if(minutes(base)+candidate>=1440){refresh();status.textContent='자정을 넘지 않는 소요시간을 선택해 주세요.';return}duration=candidate;chooseStart(base)};for(const event of['pointerdown','touchstart','wheel'])durationWheel.addEventListener(event,()=>{userScrolling=true},{passive:true});durationWheel.addEventListener('scroll',()=>{clearTimeout(timer);if(!userScrolling)return;timer=setTimeout(()=>{if(!form.isConnected)return;const rect=durationWheel.getBoundingClientRect(),center=rect.left+rect.width/2;const closest=[...durationWheel.querySelectorAll('button')].reduce((best,button)=>{const r=button.getBoundingClientRect(),distance=Math.abs(r.left+r.width/2-center);return !best||distance<best.distance?{button,distance}:best},null);const actual=start.value&&end.value?minutes(end.value)-minutes(start.value):0;if(closest&&closest.distance<45&&Number(closest.button.dataset.activityDuration)!==actual)closest.button.click()},150)},{passive:true});for(const input of[start,end])input.addEventListener('change',()=>{if(start.value&&end.value&&minutes(end.value)>minutes(start.value))duration=minutes(end.value)-minutes(start.value);refresh()});form.querySelector('[data-activity-clear]').onclick=()=>{start.value='';end.value='';refresh()};form.querySelector('[data-activity-now]').onclick=()=>{const now=new Date();chooseStart(format(Math.floor((now.getHours()*60+now.getMinutes())/5)*5))};refresh()}
